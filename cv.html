<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="title.cv">Curriculum Vitae</title>
<meta name="description" content="Curriculum vitae of Jiangtao Shen, postdoctoral researcher at the Earlham Institute.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("lang");
    if (l) document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
  } catch (e) {}
</script>
</head>
<body>

<header id="site-header"></header>

<main class="wrap">
  <h1 class="page-title" data-i18n="page.cvTitle">Curriculum Vitae</h1>
  <p class="page-lede" data-i18n-html="page.cvLede">
    A PDF version is available <a href="assets/pdf/cv.pdf">here</a>.
  </p>

  <div id="cv"></div>
</main>

<footer id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/cv.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
