<!DOCTYPE html>
<!-- ===========================================================================
     Template for a project detail page.

     To add a project page:
       1. copy this file to projects/<id>.html, where <id> matches the `id`
          field of the entry in data/projects.js
       2. set `detail: true` on that entry so the card links here
       3. fill in the title, meta description and the body below

     Every asset path on this page is relative to the site root, because
     window.BASE is set to "../" for the shared script.
     =========================================================================== -->
