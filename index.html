<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="title.about">Jiangtao Shen</title>
<meta name="description" content="Academic homepage of Jiangtao Shen, postdoctoral researcher at the Earlham Institute, Norwich.">
<meta name="author" content="Jiangtao Shen">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("lang");
    if (l) document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
  } catch (e) {}
</script>
</head>
<body>

<header id="site-header"></header>

<main class="wrap">

  <section id="hero"></section>

  <section>
    <h2 class="section-title" data-i18n="section.interests">Research Interests</h2>
    <div id="interests"></div>
  </section>

  <section>
    <h2 class="section-title" data-i18n="section.news">News</h2>
    <ul id="news"></ul>
  </section>

  <section>
    <h2 class="section-title" data-i18n="section.selectedPubs">Selected Publications</h2>
    <div id="pub-list" data-selected="true"></div>
    <p class="more"><a href="publications.html" data-i18n="link.allPubs">All publications &rarr;</a></p>
  </section>

  <section>
    <h2 class="section-title" data-i18n="section.featured">Featured Projects</h2>
    <div id="project-list" data-featured="true"></div>
    <p class="more"><a href="projects.html" data-i18n="link.allProjects">All projects &rarr;</a></p>
  </section>

</main>

<footer id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
