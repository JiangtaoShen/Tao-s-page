<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-title="title.about">Jiangtao Shen</title>
<meta name="description" content="Academic homepage of Jiangtao Shen, postdoctoral researcher at the Earlham Institute, Norwich.">
<meta name="author" content="Jiangtao Shen">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  try {
    var t = localStorage.getItem("theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
    var l = localStorage.getItem("lang");
    if (l) document.documentElement.setAttribute("lang", l === "zh" ? "zh-CN" : "en");
  } catch (e) {}
</script>
</head>
<body>

<header id="site-header"></header>
<div id="toc-backdrop" class="toc-backdrop"></div>
<button id="toc-tab" class="toc-tab" type="button"></button>
<aside id="toc" class="toc" aria-label="Contents"></aside>

<main class="wrap">

  <section id="hero"></section>

  <!-- Education and experience, the CV sections marked top:true in data/cv.js.
       Each one renders its own heading. -->
  <div id="cv-top"></div>

  <section id="sec-interests">
    <h2 class="section-title" data-i18n="section.interests" data-icon="interests">Research Interests</h2>
    <div id="interests"></div>
  </section>

  <section id="sec-news">
    <h2 class="section-title" data-i18n="section.news" data-icon="news">News</h2>
    <ul id="news"></ul>
  </section>

  <section id="sec-publications">
    <h2 class="section-title" data-i18n="section.publications" data-icon="publications">Publications</h2>
    <div id="pub-toolbar"></div>
    <div id="pub-list"></div>
  </section>

  <section id="sec-projects">
    <h2 class="section-title" data-i18n="section.projects" data-icon="projects">Projects</h2>
    <div id="project-list"></div>
  </section>

  <!-- Awards, talks, teaching, service and skills: the remaining CV sections. -->
  <div id="cv"></div>

  <section id="sec-contact">
    <h2 class="section-title" data-i18n="section.contact" data-icon="contact">Contact</h2>
    <div id="contact"></div>
  </section>

</main>

<footer id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/publications.js"></script>
<script src="data/projects.js"></script>
<script src="data/cv.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
